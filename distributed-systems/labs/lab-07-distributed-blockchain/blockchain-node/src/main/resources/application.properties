quarkus.http.host=127.0.0.1
quarkus.http.port=${NODE_PORT:8081}
node.name=${NODE_NAME:A}
node.peers=${NODE_PEERS:B@ws://localhost:8082,C@ws://localhost:8083}
# Each node can be a miner; by default only manually requested blocks are mined.
node.miner.enabled=${NODE_MINER_ENABLED:false}
node.miner.interval=${NODE_MINER_INTERVAL:5s}
quarkus.websockets-next.server.traffic-logging.enabled=true
quarkus.websockets-next.client.traffic-logging.enabled=true
quarkus.log.category."io.quarkus.websockets.next.traffic".level=DEBUG
# Dev UI: http://localhost:<NODE_PORT>/q/dev-ui
