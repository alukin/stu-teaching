<title id="title">1. Будова блоку</title><desc id="desc">Навчальна схема до лабораторної роботи №5.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L8 4 L1 7z" fill="#108c83"/></marker></defs>
