<text x="550" y="51" fill="#123455" font-family="DejaVu Sans,Arial,sans-serif" font-size="29" font-weight="700" text-anchor="middle">1. Будова блоку</text>
<rect x="38" y="89" width="660" height="385" rx="18" fill="#ffffff" stroke="#2479b5" stroke-width="3"/><rect x="38" y="89" width="660" height="58" rx="18" fill="#2479b5" stroke="#2479b5" stroke-width="2"/><text x="68" y="128" fill="#fff" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="700" text-anchor="start">Поля блоку</text><rect x="61" y="166" width="608" height="61" rx="9" fill="#ebf4fb" stroke="#c7dfed" stroke-width="1"/><text x="79" y="203" fill="#14395e" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="700" text-anchor="start">previousHash</text><text x="283" y="203" fill="#274a65" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="400" text-anchor="start">хеш попереднього блоку</text><rect x="61" y="239" width="608" height="61" rx="9" fill="#f3f9fc" stroke="#c7dfed" stroke-width="1"/><text x="79" y="276" fill="#14395e" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="700" text-anchor="start">timestamp</text><text x="283" y="276" fill="#274a65" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="400" text-anchor="start">час створення</text><rect x="61" y="312" width="608" height="61" rx="9" fill="#ebf4fb" stroke="#c7dfed" stroke-width="1"/><text x="79" y="349" fill="#14395e" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="700" text-anchor="start">nonce</text><text x="283" y="349" fill="#274a65" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="400" text-anchor="start">число для Proof of Work</text><rect x="61" y="385" width="608" height="61" rx="9" fill="#f3f9fc" stroke="#c7dfed" stroke-width="1"/><text x="79" y="422" fill="#14395e" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="700" text-anchor="start">data</text><text x="283" y="422" fill="#274a65" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="400" text-anchor="start">дані блоку</text><line x1="707" y1="275" x2="780" y2="275" stroke="#108c83" stroke-width="3" marker-end="url(#arrow)"/><rect x="796" y="216" width="265" height="124" rx="17" fill="#e4f6ef" stroke="#108c83" stroke-width="3"/><text x="928" y="252" fill="#146357" font-family="DejaVu Sans,Arial,sans-serif" font-size="26" font-weight="700" text-anchor="middle">SHA-256</text><text x="928" y="286" fill="#123455" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="700" text-anchor="middle">hash поточного</text><text x="928" y="313" fill="#123455" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="700" text-anchor="middle">блоку</text><rect x="42" y="494" width="1016" height="68" rx="12" fill="#eef7fc" stroke="#bcd9e8" stroke-width="1"/><text x="550" y="524" fill="#123455" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" text-anchor="middle">hash = SHA-256(previousHash + ':' + timestamp + ':' +</text><text x="550" y="549" fill="#123455" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" text-anchor="middle">nonce + ':' + data)</text><text x="550" y="599" fill="#157c76" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="700" text-anchor="middle">Невелика зміна вхідних даних зазвичай істотно змінює hash.</text>
