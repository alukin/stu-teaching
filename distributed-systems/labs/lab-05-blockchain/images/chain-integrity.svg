<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="740" viewBox="0 0 1100 740" role="img" aria-labelledby="title desc">
<title id="title">3. Зміна даних і цілісність ланцюга</title><desc id="desc">Навчальна схема до лабораторної роботи №5.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L8 4 L1 7z" fill="#108c83"/></marker></defs>
<rect x="1" y="1" width="1098" height="738" rx="18" fill="#f8fcff" stroke="#bed8e9" stroke-width="2"/>
<text x="550" y="51" fill="#123455" font-family="DejaVu Sans,Arial,sans-serif" font-size="29" font-weight="700" text-anchor="middle">3. Зміна даних і цілісність ланцюга</text>
<text x="39" y="104" fill="#12695f" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" text-anchor="start">Початковий ланцюг: усі хеші та зв'язки узгоджені</text><rect x="45" y="125" width="304" height="148" rx="14" fill="#fff" stroke="#7cb3d7" stroke-width="2"/><rect x="45" y="125" width="304" height="37" rx="13" fill="#2479b5" stroke="#2479b5" stroke-width="2"/><text x="197" y="151" fill="#fff" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" text-anchor="middle">Блок 0</text><text x="62" y="195" fill="#123455" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="400" text-anchor="start">data: A</text><text x="62" y="228" fill="#123455" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" text-anchor="start">previousHash: 0</text><text x="62" y="260" fill="#12695f" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="700" text-anchor="start">stored hash: h0</text><line x1="352" y1="195" x2="388" y2="195" stroke="#108c83" stroke-width="3" marker-end="url(#arrow)"/><rect x="403" y="125" width="304" height="148" rx="14" fill="#fff" stroke="#7cb3d7" stroke-width="2"/><rect x="403" y="125" width="304" height="37" rx="13" fill="#2479b5" stroke="#2479b5" stroke-width="2"/><text x="555" y="151" fill="#fff" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" text-anchor="middle">Блок 1</text><text x="420" y="195" fill="#123455" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="400" text-anchor="start">data: B</text><text x="420" y="228" fill="#123455" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" text-anchor="start">previousHash: h0</text><text x="420" y="260" fill="#12695f" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="700" text-anchor="start">stored hash: h1</text><line x1="710" y1="195" x2="746" y2="195" stroke="#108c83" stroke-width="3" marker-end="url(#arrow)"/><rect x="761" y="125" width="304" height="148" rx="14" fill="#fff" stroke="#7cb3d7" stroke-width="2"/><rect x="761" y="125" width="304" height="37" rx="13" fill="#2479b5" stroke="#2479b5" stroke-width="2"/><text x="913" y="151" fill="#fff" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" text-anchor="middle">Блок 2</text><text x="778" y="195" fill="#123455" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="400" text-anchor="start">data: C</text><text x="778" y="228" fill="#123455" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" text-anchor="start">previousHash: h1</text><text x="778" y="260" fill="#12695f" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="700" text-anchor="start">stored hash: h2</text><text x="39" y="317" fill="#b63f49" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" text-anchor="start">Після зміни data у блоці 1 без перерахунку збереженого hash</text><rect x="45" y="339" width="304" height="148" rx="14" fill="#fff" stroke="#7cb3d7" stroke-width="2"/><rect x="45" y="339" width="304" height="37" rx="13" fill="#2479b5" stroke="#2479b5" stroke-width="2"/><text x="197" y="365" fill="#fff" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" text-anchor="middle">Блок 0</text><text x="62" y="409" fill="#123455" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="400" text-anchor="start">data: A</text><text x="62" y="442" fill="#123455" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" text-anchor="start">previousHash: 0</text><text x="62" y="474" fill="#12695f" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="700" text-anchor="start">stored hash: h0</text><line x1="352" y1="409" x2="388" y2="409" stroke="#108c83" stroke-width="3" marker-end="url(#arrow)"/><rect x="403" y="339" width="304" height="148" rx="14" fill="#fff0f0" stroke="#c45160" stroke-width="3"/><rect x="403" y="339" width="304" height="37" rx="13" fill="#b63f49" stroke="#b63f49" stroke-width="2"/><text x="555" y="365" fill="#fff" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" text-anchor="middle">Блок 1</text><text x="420" y="409" fill="#b63f49" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="700" text-anchor="start">data: B'</text><text x="420" y="442" fill="#123455" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" text-anchor="start">previousHash: h0</text><text x="420" y="474" fill="#b63f49" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="700" text-anchor="start">stored hash: h1</text><line x1="710" y1="409" x2="746" y2="409" stroke="#b63f49" stroke-width="3" /><rect x="761" y="339" width="304" height="148" rx="14" fill="#fff" stroke="#7cb3d7" stroke-width="2"/><rect x="761" y="339" width="304" height="37" rx="13" fill="#2479b5" stroke="#2479b5" stroke-width="2"/><text x="913" y="365" fill="#fff" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" text-anchor="middle">Блок 2</text><text x="778" y="409" fill="#123455" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="400" text-anchor="start">data: C</text><text x="778" y="442" fill="#b63f49" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="700" text-anchor="start">previousHash: h1</text><text x="778" y="474" fill="#12695f" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="700" text-anchor="start">stored hash: h2</text><rect x="41" y="512" width="1016" height="150" rx="14" fill="#f5f9fc" stroke="#b6d2e4" stroke-width="2"/><text x="65" y="547" fill="#b63f49" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="700" text-anchor="start">1. Зміна data: calculateHash() ≠ stored hash → isValid() повертає false.</text><text x="65" y="589" fill="#123455" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start">2. Після повторного майнінгу блоку 1 отримаємо новий хеш h1'.</text><text x="65" y="630" fill="#123455" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start">3. Блок 2 зберігає previousHash = h1, тому зв'язок стане недійсним.</text><text x="550" y="704" fill="#12695f" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" text-anchor="middle">Висновок: перевірка цілісності виявляє підміну даних.</text>
</svg>