="#234763" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" text-anchor="start">4e1a7d...</text><text x="1031" y="305" fill="#c64150" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="700" text-anchor="middle">×</text><rect x="757" y="322" width="290" height="37" rx="8" fill="#ddf4ed" stroke="#72bd9c" stroke-width="1"/><text x="771" y="347" fill="#123455" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="700" text-anchor="start">nonce = 4</text><text x="884" y="347" fill="#077b65" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="700" text-anchor="start">000b7e...</text><text x="1031" y="347" fill="#077b65" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="700" text-anchor="middle">✓</text><path d="M 913 385 L 913 424 L 547 424 L 547 317" fill="none" stroke="#108c83" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="52" y="455" width="998" height="69" rx="12" fill="#e9f7f3" stroke="#b6dfd2" stroke-width="1"/><text x="550" y="484" fill="#12695f" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="middle">Умова: hash починається з difficulty нулів</text><text x="550" y="510" fill="#123455" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="middle">Якщо ні — збільшуємо nonce та повторюємо обчислення.</text>
